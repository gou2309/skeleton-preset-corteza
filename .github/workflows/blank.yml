# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "origin" branch
  push:
    branches: [ "origin" ]
  pull_request:
    branches: [ "origin" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
- name: Cache de dependencias
  uses: actions/cache@v4
  with:
    path: |
      ~/.npm
      node_modules
    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    restore-keys: |
      ${{ runner.os }}-node-
jobs:
  validar-proyecto:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependencias
        run: npm install
import sqlite3 from 'sqlite3';
import { open } from 'sqlite';

export async function openDb() {
  return open({
    filename: './database.sqlite',
    driver: sqlite3.Database
  });
}

export async function initDb() {
  const db = await openDb();
  await db.exec(`
    CREATE TABLE IF NOT EXISTS zonas (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      tienda TEXT,
      zona_colonia TEXT,
      ciudad_estado TEXT,
      giro_negocio TEXT,
      ubicacion_exacta TEXT,
      nivel_competencia TEXT,
      publico_objetivo TEXT,
      rango_precios TEXT,
      trafico_personas TEXT,
      anuncios_entrelazados TEXT,
      app_activa TEXT,
      privacidad TEXT,
      consentimiento_datos TEXT,
      fecha_actualizacion TEXT
    )
  `);
  await db.close();
}

export async function getZonas(shop) {
  const db = await openDb();
  const zonas = await db.all('SELECT * FROM zonas WHERE tienda = ?', [shop]);
  await db.close();
  return zonas;
}

export async function saveZona(shop, zona) {
  const db = await openDb();
  const {
    zona_colonia,
    ciudad_estado,
    giro_negocio,
    ubicacion_exacta,
    nivel_competencia,
    publico_objetivo,
    rango_precios,
    trafico_personas,
    anuncios_entrelazados,
    app_activa,
    privacidad,
    consentimiento_datos
  } = zona;
  const result = await db.run(
    `INSERT INTO zonas (
      tienda,
      zona_colonia,
      ciudad_estado,
      giro_negocio,
      ubicacion_exacta,
      nivel_competencia,
      publico_objetivo,
      rango_precios,
      trafico_personas,
      anuncios_entrelazados,
      app_activa,
      privacidad,
      consentimiento_datos,
      fecha_actualizacion
    ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
    [
      shop,
      zona_colonia,
      ciudad_estado,
      giro_negocio,
      ubicacion_exacta,
      nivel_competencia,
      publico_objetivo,
      rango_precios,
      trafico_personas,
      anuncios_entrelazados,
      app_activa,
      privacidad,
      consentimiento_datos,
      new Date().toISOString()
    ]
  );
  await db.close();
  return result.lastID;
}
